<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dataverse">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ this.page.title }} - The DataVerse</title>

    {% framework extras %}
    {% styles %}
    <link rel="stylesheet" href="{{ 'assets/vendor/tailwind/tailwind.css'|theme }}">
    {% styles %}
  </head>

  <body class="bg-dv-bg text-dv-text min-h-screen flex flex-col font-tilt">

    {% partial 'site/navbar' %}

    <main class="flex-grow flex items-center justify-center container mx-auto px-4">
      {% page %}
    </main>

    {% partial 'site/footer' %}

    {% scripts %}

    {# ✅ Load cargo scripts only on the cargo page #}
    {% if this.page.id == 'cargo' %}

      <script src="{{ 'assets/js/cargo-table.js'|theme }}"></script>

    {% endif %}
  </body>
</html>
