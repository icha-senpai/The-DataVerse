<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@16.1.1/styles/handsontable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@16.1.1/styles/ht-theme-main.min.css">

<canvas id="dataverseStars" class="fixed inset-0 -z-10"></canvas>
<div class="relative py-12 overflow-hidden">
  <div class="relative container mx-auto text-center">
    <h1 class="text-4xl font-tilt text-dv-accent mb-6 tracking-wide neon-glow">
      🚀 Cargo Tracker
    </h1>

    <div class="rounded-xl border border-dv-accent/40 shadow-[0_0_25px_rgba(0,255,255,0.3)] bg-dv-surface/60 backdrop-blur-sm p-4">
      <div id="cargoTable" class="w-full"></div>
    </div>
  </div>
</div>

<style>

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 15px #00eaff, inset 0 0 10px #00eaff; }
  50% { box-shadow: 0 0 25px #ff00aa, inset 0 0 15px #ff00aa; }
}

#cargoTable {
  animation: pulse 4s ease-in-out infinite;
}


.neon-glow {
  text-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 40px #ff00aa;
}


#cargoTable {

  max-width: 100%;
  min-width: 1200px; /* optional: prevent it from becoming a stick */
}
/* Bring nav and dropdowns above everything */
nav, header, .navbar, .menu, .dropdown, .dropdown-menu {
  position: relative;
  z-index: 9999 !important;
  isolation: isolate;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/numbro@2.0.6/numbro.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/handsontable@16.1.1/dist/handsontable.full.min.js"></script>
<script src="{{ 'assets/js/cargo-table.js'|theme }}"></script>
<script>
const canvas = document.getElementById('dataverseStars');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const stars = Array.from({ length: 120 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 1.5,
  s: Math.random() * 0.6 + 0.2,
}));

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const star of stars) {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,234,255,${Math.random() * 0.7})`;
    ctx.fill();
    star.y += star.s;
    if (star.y > canvas.height) star.y = -star.r;
  }
  requestAnimationFrame(draw);
}
draw();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
