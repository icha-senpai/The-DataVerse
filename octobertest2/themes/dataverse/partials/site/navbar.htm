[viewBag]
==
<?php
use Symfony\Component\Yaml\Yaml;

function onStart()
{
    $path = themes_path('dataverse/meta/navigation.yaml');
    if (file_exists($path)) {
        $yaml = file_get_contents($path);
        $data = Yaml::parse($yaml);
        $this['nav'] = isset($data['main']) ? $data['main'] : [];
    } else {
        $this['nav'] = [];
    }
}
?>
==
{% set nav = nav %}

<nav class="fixed top-0 z-50 w-full bg-dv-surface/80 backdrop-blur-md border-b border-gray-800 shadow-neon">
  <div class="max-w-7xl mx-auto px-6 flex justify-between items-center h-16">
    <a href="{{ 'home'|page }}" class="text-2xl font-tilt font-bold text-dv-accent hover:text-dv-accent2">
      The DataVerse
    </a>

    <ul class="hidden md:flex items-center space-x-4 font-tilt text-dv-text">
      {% for item in nav %}
        <li class="relative">{% partial 'site/nav-item' item=item %}</li>
      {% endfor %}
    </ul>

    <button id="mobile-toggle"
            class="md:hidden text-dv-accent hover:text-dv-accent2 focus:outline-none">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <div id="mobile-menu"
       class="hidden flex-col space-y-2 p-6 font-tilt text-dv-text md:hidden bg-dv-surface/90 border-t border-gray-700">
    {% for item in nav %}
      <div class="mobile-nav-item">{% partial 'site/nav-item' item=item %}</div>
    {% endfor %}
  </div>
</nav>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const toggle = document.getElementById('mobile-toggle');
  const menu = document.getElementById('mobile-menu');

  toggle.addEventListener('click', () => {
    menu.classList.toggle('hidden');
    menu.classList.toggle('flex');
  });
});
</script>
