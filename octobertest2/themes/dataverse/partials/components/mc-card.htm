<div class="relative bg-[#0d0d1a]/70 border border-[#1f1f30] rounded-2xl p-6 text-center 
            hover:border-green-400/50 transition group overflow-hidden">

  <!-- Icon -->
  <div class="relative text-5xl mb-3 z-10">{{ icon }}</div>

  <!-- Title -->
  <h3 class="relative text-2xl font-bold z-10 
             text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-cyan-400">
    {{ title }}
  </h3>

  <!-- Description -->
  <p class="relative mt-3 text-gray-300 z-10">{{ desc }}</p>

  <!-- Hover Glow -->
  <div class="absolute inset-0 rounded-2xl 
              bg-gradient-to-r from-green-500 to-cyan-400 
              opacity-0 group-hover:opacity-10 blur-2xl transition"></div>
</div>
