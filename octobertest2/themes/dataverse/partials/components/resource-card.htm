<a href="{{ link|page }}" class="group relative bg-[#0d0d1a]/70 border border-[#1f1f30] 
       rounded-xl p-6 hover:border-cyan-400/50 transition block text-center overflow-hidden">

  <h3 class="relative text-xl font-semibold z-10 
             text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-400 mb-2">
    {{ title }}
  </h3>
  <p class="relative text-gray-300 text-sm z-10">{{ desc }}</p>

  <div class="absolute inset-0 rounded-xl bg-gradient-to-r from-cyan-400 to-fuchsia-400 
              opacity-0 group-hover:opacity-10 blur-2xl transition"></div>
</a>
